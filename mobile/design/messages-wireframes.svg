<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1482" viewBox="0 0 1000 1482" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / messages wireframes</title>
  <desc id="description">Mobile conversations list and a chat thread. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1482" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / messages wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-10-conversations" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">10 / Conversations</text><text x="390" y="-18" text-anchor="end" class="route">Chats tab</text>
    <g id="mobile-10-conversations-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="195" y="82" text-anchor="middle" class="title">Chats</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><rect x="24" y="118" width="342" height="46" rx="12" class="fill"/><text x="40" y="146" class="label">Requests → 09</text><rect x="318" y="128" width="29" height="26" rx="13" class="fill-dark"/><text x="332.5" y="145" text-anchor="middle" class="chip-on">2</text><circle cx="48" cy="214" r="20" class="fill"/><text x="80" y="210" class="label">Maya Chen → 11</text><text x="80" y="230" class="small">See you at the table!</text><text x="366" y="210" text-anchor="end" class="small">2m</text><rect x="337" y="218" width="29" height="26" rx="13" class="fill-dark"/><text x="351.5" y="235" text-anchor="middle" class="chip-on">2</text><line x1="24" y1="252" x2="366" y2="252" class="line"/><rect x="28" y="270" width="40" height="40" rx="10" class="fill"/><text x="80" y="286" class="label">Team Byte Me</text><text x="80" y="306" class="small">Andrea: pushed the API</text><text x="366" y="286" text-anchor="end" class="small">15m</text><line x1="24" y1="328" x2="366" y2="328" class="line"/><circle cx="48" cy="366" r="20" class="fill"/><text x="80" y="362" class="label">Mentor · Sam Ortiz</text><text x="80" y="382" class="small">Help: Flutter build fails</text><text x="366" y="362" text-anchor="end" class="small">1h</text><line x1="24" y1="404" x2="366" y2="404" class="line"/><circle cx="48" cy="442" r="20" class="fill"/><text x="80" y="438" class="label">Reagan Smith</text><text x="80" y="458" class="small">You: thanks!</text><text x="366" y="438" text-anchor="end" class="small">Yesterday</text><line x1="24" y1="480" x2="366" y2="480" class="line"/><rect x="24" y="506" width="342" height="96" rx="12" class="ph"/><text x="195" y="542" text-anchor="middle" class="small">Empty state:</text><text x="195" y="558" text-anchor="middle" class="small">“No chats yet. Accept a request</text><text x="195" y="574" text-anchor="middle" class="small">or ask Hacky to find people.”</text><line x1="0" y1="760" x2="390" y2="760" class="line"/><rect x="27" y="772" width="24" height="24" rx="7" class="fill"/><text x="39" y="814" text-anchor="middle" class="tab">Home</text><rect x="105" y="772" width="24" height="24" rx="7" class="fill"/><text x="117" y="814" text-anchor="middle" class="tab">People</text><rect x="183" y="772" width="24" height="24" rx="7" class="fill"/><text x="195" y="814" text-anchor="middle" class="tab">Hacky</text><rect x="261" y="772" width="24" height="24" rx="7" class="fill-dark"/><text x="273" y="814" text-anchor="middle" class="tab-on">Chats</text><rect x="339" y="772" width="24" height="24" rx="7" class="fill"/><text x="351" y="814" text-anchor="middle" class="tab">Me</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-10-conversations-notes"><text x="0" y="888" class="note">• Data: GET /api/events/{slug}/conversations, newest</text><text x="14" y="910" class="note">activity first.</text><text x="0" y="940" class="note">• Three kinds: direct message (round avatar), team</text><text x="14" y="962" class="note">(square), mentor help.</text><text x="0" y="992" class="note">• The badge is the unread count. Tap a row → 11.</text></g>
  </g>

  <g id="mobile-11-chat-thread" transform="translate(510 230)">
    <text x="0" y="-18" class="frame-title">11 / Chat thread</text><text x="390" y="-18" text-anchor="end" class="route">from 07, 09, 10</text>
    <g id="mobile-11-chat-thread-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="86" class="heading">‹</text><circle cx="64" cy="76" r="16" class="fill"/><text x="90" y="72" class="label">Maya Chen → 07</text><text x="90" y="90" class="small">Available</text><text x="366" y="82" text-anchor="end" class="title">•••</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><text x="195" y="134" text-anchor="middle" class="small">Maya accepted your request · Today</text><rect x="24" y="150" width="194.8" height="60" rx="18" class="fill"/><text x="40" y="175" class="value">Hey! Want to team up?</text><text x="40" y="195" class="value">I can do the frontend.</text><rect x="134.2" y="228" width="231.8" height="40" rx="18" class="fill-dark"/><text x="150.2" y="253" class="bubble-on">Yes! Where are you sitting?</text><rect x="24" y="286" width="194.8" height="40" rx="18" class="fill"/><text x="40" y="311" class="value">Table 14, by the stage</text><rect x="267.4" y="344" width="98.60000000000001" height="40" rx="18" class="fill-dark"/><text x="283.4" y="369" class="bubble-on">On my way</text><text x="366" y="404" text-anchor="end" class="small">Seen</text><rect x="24" y="440" width="342" height="70" rx="12" class="ph"/><text x="195" y="471" text-anchor="middle" class="small">Long-press my message:</text><text x="195" y="487" text-anchor="middle" class="small">Unsend for everyone</text><rect x="24" y="752" width="286" height="44" rx="22" class="field"/><text x="42" y="779" class="placeholder">Message…</text><rect x="322" y="752" width="44" height="44" rx="22" class="fill-dark"/><text x="344" y="780" text-anchor="middle" class="button-text">↑</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-11-chat-thread-notes"><text x="0" y="888" class="note">• Data: GET /api/conversations/{id}/messages (oldest</text><text x="14" y="910" class="note">first, paged). Scroll up loads older ones.</text><text x="0" y="940" class="note">• Send → POST /api/conversations/{id}/messages with a</text><text x="14" y="962" class="note">clientId. It shows right away with “Sending…” until</text><text x="14" y="984" class="note">saved.</text><text x="0" y="1014" class="note">• Opening the chat → POST /api/conversations/{id}/read.</text><text x="14" y="1036" class="note">“Seen” comes from the peer’s last read time.</text><text x="0" y="1066" class="note">• Unsend → DELETE</text><text x="14" y="1088" class="note">/api/conversations/{id}/messages/{messageId}. ••• →</text><text x="14" y="1110" class="note">View profile 07 · Block.</text></g>
  </g>
</svg>
