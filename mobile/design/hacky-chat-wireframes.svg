<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1416" viewBox="0 0 1000 1416" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / Hacky chat wireframes</title>
  <desc id="description">Mobile chat with Hacky, the AI helper that suggests people as cards. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1416" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / Hacky chat wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-12-hacky-chat" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">12 / Hacky chat</text><text x="390" y="-18" text-anchor="end" class="route">Hacky tab · from 05</text>
    <g id="mobile-12-hacky-chat-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <rect x="24" y="56" width="44" height="44" rx="22" class="ph"/><text x="46" y="82" text-anchor="middle" class="small">Hacky</text><text x="80" y="74" class="title">Hacky</text><text x="80" y="94" class="small">Your hackathon helper</text><line x1="0" y1="112" x2="390" y2="112" class="line"/><rect x="24" y="128" width="268.8" height="60" rx="18" class="fill"/><text x="40" y="153" class="value">Hi Ethan! What are you building,</text><text x="40" y="173" class="value">and who do you need?</text><rect x="112" y="206" width="254" height="40" rx="18" class="fill-dark"/><text x="128" y="231" class="bubble-on">A frontend dev who knows React</text><text x="24" y="286" class="body">Here are two people who match:</text><rect x="24" y="298" width="300" height="92" rx="14" class="field"/><circle cx="54" cy="332" r="18" class="fill"/><text x="82" y="328" class="label">Andrea Lopez</text><text x="82" y="347" class="small">@andrea_l · React, Node</text><rect x="40" y="358" width="120" height="24" rx="10" class="field"/><text x="100" y="375" text-anchor="middle" class="label">View → 07</text><rect x="170" y="358" width="120" height="24" rx="10" class="fill-dark"/><text x="230" y="375" text-anchor="middle" class="chip-on">Connect</text><rect x="24" y="400" width="300" height="92" rx="14" class="field"/><circle cx="54" cy="434" r="18" class="fill"/><text x="82" y="430" class="label">Bo Kim</text><text x="82" y="449" class="small">@bokim · React Native</text><rect x="40" y="460" width="120" height="24" rx="10" class="field"/><text x="100" y="477" text-anchor="middle" class="label">View → 07</text><rect x="170" y="460" width="120" height="24" rx="10" class="fill-dark"/><text x="230" y="477" text-anchor="middle" class="chip-on">Connect</text><rect x="24" y="506" width="72" height="32" rx="16" class="fill"/><text x="60" y="527" text-anchor="middle" class="label">• • •</text><text x="108" y="527" class="small">Hacky is typing</text><rect x="24" y="560" width="108" height="26" rx="13" class="fill"/><text x="78" y="577" text-anchor="middle" class="chip">Find a mentor</text><rect x="140" y="560" width="187" height="26" rx="13" class="fill"/><text x="233.5" y="577" text-anchor="middle" class="chip">Who’s looking for a team?</text><rect x="24" y="594" width="154" height="26" rx="13" class="fill"/><text x="101" y="611" text-anchor="middle" class="chip">Help me pick a track</text><rect x="24" y="700" width="286" height="44" rx="22" class="field"/><text x="42" y="727" class="placeholder">Message…</text><rect x="322" y="700" width="44" height="44" rx="22" class="fill-dark"/><text x="344" y="728" text-anchor="middle" class="button-text">↑</text><line x1="0" y1="760" x2="390" y2="760" class="line"/><rect x="27" y="772" width="24" height="24" rx="7" class="fill"/><text x="39" y="814" text-anchor="middle" class="tab">Home</text><rect x="105" y="772" width="24" height="24" rx="7" class="fill"/><text x="117" y="814" text-anchor="middle" class="tab">People</text><rect x="183" y="772" width="24" height="24" rx="7" class="fill-dark"/><text x="195" y="814" text-anchor="middle" class="tab-on">Hacky</text><rect x="261" y="772" width="24" height="24" rx="7" class="fill"/><text x="273" y="814" text-anchor="middle" class="tab">Chats</text><rect x="339" y="772" width="24" height="24" rx="7" class="fill"/><text x="351" y="814" text-anchor="middle" class="tab">Me</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-12-hacky-chat-notes"><text x="0" y="888" class="note">• Data: GET /api/events/{slug}/chat (history). Send →</text><text x="14" y="910" class="note">POST /api/events/{slug}/chat; the answer streams in.</text><text x="0" y="940" class="note">• Tool results arrive as cards (people, teams, help</text><text x="14" y="962" class="note">requests). Connect opens the same intro sheet as 07.</text><text x="0" y="992" class="note">• The header uses the animated knit Hacky: waving when</text><text x="14" y="1014" class="note">idle, thinking while answering.</text><text x="0" y="1044" class="note">• Suggestion chips fill the composer when tapped.</text></g>
  </g>
</svg>
