<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1460" viewBox="0 0 1000 1460" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / home wireframes</title>
  <desc id="description">Mobile home for the signed-in user with their event. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1460" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / home wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-05-home" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">05 / Home with event</text><text x="390" y="-18" text-anchor="end" class="route">Home tab · after log in</text>
    <g id="mobile-05-home-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="84" class="brand">hacky.</text><circle cx="348" cy="76" r="18" class="fill"/><text x="366" y="114" text-anchor="end" class="nav">avatar → 08</text><rect x="24" y="126" width="342" height="148" rx="16" class="field"/><text x="40" y="152" class="tag">YOUR EVENT</text><rect x="290" y="136" width="62" height="26" rx="13" class="fill"/><text x="321" y="153" text-anchor="middle" class="chip">Hacker</text><text x="40" y="182" class="title">Knight Hacks IX</text><text x="40" y="204" class="small">Fri Oct 24 – Sun Oct 26</text><rect x="40" y="226" width="35" height="26" rx="13" class="fill"/><text x="57.5" y="243" text-anchor="middle" class="chip">AI</text><rect x="83" y="226" width="62" height="26" rx="13" class="fill"/><text x="114" y="243" text-anchor="middle" class="chip">Health</text><rect x="153" y="226" width="68" height="26" rx="13" class="fill"/><text x="187" y="243" text-anchor="middle" class="chip">Fintech</text><rect x="229" y="226" width="48" height="26" rx="13" class="fill"/><text x="253" y="243" text-anchor="middle" class="chip">Open</text><text x="24" y="312" class="label">Looking for a team</text><rect x="318" y="294" width="48" height="28" rx="14" class="fill-dark"/><circle cx="352" cy="308" r="10" class="frame"/><rect x="24" y="334" width="342" height="36" rx="10" class="fill"/><rect x="28" y="338" width="111.33333333333333" height="28" rx="8" class="frame"/><text x="83.66666666666666" y="357" text-anchor="middle" class="label">Available</text><text x="194.99999999999997" y="357" text-anchor="middle" class="body">Busy</text><text x="306.3333333333333" y="357" text-anchor="middle" class="body">Offline</text><rect x="24" y="388" width="342" height="108" rx="16" class="field"/><rect x="36" y="400" width="84" height="84" rx="12" class="ph"/><text x="78" y="446" text-anchor="middle" class="small">Hacky</text><text x="134" y="426" class="title">Ask Hacky</text><text x="134" y="450" class="body">“Find me a frontend teammate”</text><text x="134" y="478" class="link">Open chat → 12</text><rect x="24" y="512" width="342" height="54" rx="12" class="field"/><text x="40" y="544" class="label">Requests → 09</text><rect x="290" y="526" width="55" height="26" rx="13" class="fill-dark"/><text x="317.5" y="543" text-anchor="middle" class="chip-on">2 new</text><text x="24" y="600" class="tag">MY TEAM</text><rect x="24" y="610" width="342" height="50" rx="12" class="field"/><text x="40" y="640" class="body">No team yet</text><text x="350" y="640" text-anchor="end" class="link">Create team</text><text x="24" y="690" class="tag">PEOPLE YOU MIGHT LIKE</text><circle cx="48" cy="726" r="20" class="fill"/><text x="80" y="722" class="label">Maya Chen</text><text x="80" y="741" class="small">@maya · Design, React</text><text x="366" y="748" text-anchor="end" class="nav">→ 07</text><line x1="24" y1="756" x2="366" y2="756" class="line"/><line x1="0" y1="760" x2="390" y2="760" class="line"/><rect x="27" y="772" width="24" height="24" rx="7" class="fill-dark"/><text x="39" y="814" text-anchor="middle" class="tab-on">Home</text><rect x="105" y="772" width="24" height="24" rx="7" class="fill"/><text x="117" y="814" text-anchor="middle" class="tab">People</text><rect x="183" y="772" width="24" height="24" rx="7" class="fill"/><text x="195" y="814" text-anchor="middle" class="tab">Hacky</text><rect x="261" y="772" width="24" height="24" rx="7" class="fill"/><text x="273" y="814" text-anchor="middle" class="tab">Chats</text><rect x="339" y="772" width="24" height="24" rx="7" class="fill"/><text x="351" y="814" text-anchor="middle" class="tab">Me</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-05-home-notes"><text x="0" y="888" class="note">• Data: GET /api/me, GET /api/events/{slug}, GET</text><text x="14" y="910" class="note">/api/events/{slug}/me.</text><text x="0" y="940" class="note">• Looking for a team and availability save right away</text><text x="14" y="962" class="note">(PATCH /api/events/{slug}/me).</text><text x="0" y="992" class="note">• No event yet: this screen shows the events to join</text><text x="14" y="1014" class="note">instead (GET /api/events, then POST</text><text x="14" y="1036" class="note">/api/events/{slug}/join).</text><text x="0" y="1066" class="note">• Bottom tabs on every signed-in screen: Home 05 ·</text><text x="14" y="1088" class="note">People 06 · Hacky 12 · Chats 10 · Me 08.</text></g>
  </g>
</svg>
