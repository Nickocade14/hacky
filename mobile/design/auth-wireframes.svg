<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1438" viewBox="0 0 1880 1438" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / auth wireframes</title>
  <desc id="description">Mobile login and create account (one screen with tabs), check your inbox, and forgot password. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1880" height="1438" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / auth wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="1840" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-01-log-in" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">01 / Log in (tab)</text><text x="390" y="-18" text-anchor="end" class="route">first screen without a session</text>
    <g id="mobile-01-log-in-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <rect x="115" y="62" width="160" height="170" rx="12" class="ph"/><text x="195" y="143" text-anchor="middle" class="small">Knit Hacky</text><text x="195" y="159" text-anchor="middle" class="small">mascot (waving)</text><text x="195" y="270" text-anchor="middle" class="brand">hacky.</text><rect x="24" y="292" width="342" height="44" rx="10" class="fill"/><rect x="28" y="296" width="167" height="36" rx="8" class="frame"/><text x="111.5" y="319" text-anchor="middle" class="label">Log in</text><text x="278.5" y="319" text-anchor="middle" class="body">Create account</text><text x="366" y="352" text-anchor="end" class="nav">tab → 02</text><text x="24" y="384" class="tag">GOOD TO SEE YOU</text><text x="24" y="416" class="heading">Welcome back.</text><text x="24" y="440" class="label">Email address</text><rect x="24" y="450" width="342" height="44" rx="10" class="field"/><text x="38" y="477" class="placeholder">you@example.com</text><text x="24" y="512" class="label">Password</text><rect x="24" y="522" width="342" height="44" rx="10" class="field"/><text x="38" y="549" class="placeholder">Your password</text><text x="350" y="544" text-anchor="end" class="link">Show</text><text x="366" y="592" text-anchor="end" class="link">Forgot password? → 04</text><rect x="24" y="610" width="342" height="48" rx="10" class="fill-dark"/><text x="195" y="639" text-anchor="middle" class="button-text">Log in</text><text x="195" y="692" text-anchor="middle" class="link">New around here? Create an account → 02</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-01-log-in-notes"><text x="0" y="888" class="note">• Success → 05 Home.</text><text x="0" y="918" class="note">• Unverified email: error box above the button and a</text><text x="14" y="940" class="note">“Resend your verification email” link → 03.</text><text x="0" y="970" class="note">• Log in / Create account is one screen: mascot,</text><text x="14" y="992" class="note">wordmark and tabs stay fixed, only the form</text><text x="14" y="1014" class="note">crossfades.</text><text x="0" y="1044" class="note">• States: field errors under each field, “Please wait…”</text><text x="14" y="1066" class="note">on the button, server error box.</text></g>
  </g>

  <g id="mobile-02-create-account" transform="translate(510 230)">
    <text x="0" y="-18" class="frame-title">02 / Create account (tab)</text><text x="390" y="-18" text-anchor="end" class="route">same screen as 01</text>
    <g id="mobile-02-create-account-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <rect x="115" y="62" width="160" height="170" rx="12" class="ph"/><text x="195" y="143" text-anchor="middle" class="small">Knit Hacky</text><text x="195" y="159" text-anchor="middle" class="small">mascot (waving)</text><text x="195" y="270" text-anchor="middle" class="brand">hacky.</text><rect x="24" y="292" width="342" height="44" rx="10" class="fill"/><text x="111.5" y="319" text-anchor="middle" class="body">Log in</text><rect x="195" y="296" width="167" height="36" rx="8" class="frame"/><text x="278.5" y="319" text-anchor="middle" class="label">Create account</text><text x="24" y="352" class="nav">← tab 01</text><text x="24" y="376" class="tag">YOUR PEOPLE ARE HERE</text><text x="24" y="404" class="heading">Let’s make it happen.</text><text x="24" y="432" class="label">Your name</text><rect x="24" y="442" width="342" height="38" rx="10" class="field"/><text x="38" y="466" class="placeholder">What should we call you?</text><text x="24" y="494" class="label">Handle</text><rect x="24" y="504" width="342" height="38" rx="10" class="field"/><text x="38" y="528" class="placeholder">your_handle</text><text x="24" y="558" class="small">3–30 lowercase letters, numbers, or underscores.</text><text x="24" y="580" class="label">Email address</text><rect x="24" y="590" width="342" height="38" rx="10" class="field"/><text x="38" y="614" class="placeholder">you@example.com</text><text x="24" y="642" class="label">Password</text><rect x="24" y="652" width="342" height="38" rx="10" class="field"/><text x="38" y="676" class="placeholder">Make it a good one</text><text x="350" y="672" text-anchor="end" class="link">Show</text><rect x="24" y="704" width="342" height="44" rx="10" class="fill-dark"/><text x="195" y="731" text-anchor="middle" class="button-text">Create account</text><text x="195" y="776" text-anchor="middle" class="link">Already part of the crew? Log in → 01</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-02-create-account-notes"><text x="0" y="888" class="note">• Success → 03 Check your inbox, with the email shown.</text><text x="0" y="918" class="note">• The screen scrolls; the note “We’ll send a</text><text x="14" y="940" class="note">verification link…” sits under the button.</text><text x="0" y="970" class="note">• Password: at least 8 characters, up to 72 UTF-8 bytes</text><text x="14" y="992" class="note">(same rules as the web).</text><text x="0" y="1022" class="note">• Errors: email or handle already taken shown in the</text><text x="14" y="1044" class="note">error box.</text></g>
  </g>

  <g id="mobile-03-check-inbox" transform="translate(980 230)">
    <text x="0" y="-18" class="frame-title">03 / Check your inbox</text><text x="390" y="-18" text-anchor="end" class="route">after create account</text>
    <g id="mobile-03-check-inbox-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="82" class="link">‹ Back to log in → 01</text><rect x="24" y="108" width="52" height="52" rx="12" class="fill"/><text x="50" y="139" text-anchor="middle" class="small">icon</text><text x="24" y="196" class="tag">ONE QUICK STEP</text><text x="24" y="228" class="heading">Check your inbox.</text><text x="24" y="260" class="body">We sent a verification link to</text><text x="24" y="282" class="body">you@example.com. Open it to finish</text><text x="24" y="304" class="body">setting up your account.</text><text x="24" y="336" class="label">Email address</text><rect x="24" y="346" width="342" height="44" rx="10" class="field"/><text x="38" y="373" class="value">you@example.com</text><rect x="24" y="408" width="342" height="62" rx="10" class="fill"/><text x="40" y="434" class="small">If this address has an unverified account,</text><text x="40" y="454" class="small">a new link is on its way. (after resend)</text><rect x="24" y="488" width="342" height="48" rx="10" class="fill-dark"/><text x="195" y="517" text-anchor="middle" class="button-text">Resend verification link</text><text x="195" y="572" text-anchor="middle" class="small">Can’t find the email? Check your spam folder.</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-03-check-inbox-notes"><text x="0" y="888" class="note">• The link in the email opens the web page /verify, not</text><text x="14" y="910" class="note">the app.</text><text x="0" y="940" class="note">• After verifying on the web, the user logs in here →</text><text x="14" y="962" class="note">01.</text><text x="0" y="992" class="note">• The confirmation box only appears after tapping</text><text x="14" y="1014" class="note">Resend. It never says whether the account exists.</text></g>
  </g>

  <g id="mobile-04-forgot-password" transform="translate(1450 230)">
    <text x="0" y="-18" class="frame-title">04 / Forgot password</text><text x="390" y="-18" text-anchor="end" class="route">from 01</text>
    <g id="mobile-04-forgot-password-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="82" class="link">‹ Back to log in → 01</text><text x="24" y="136" class="tag">IT HAPPENS TO THE BEST OF US</text><text x="24" y="168" class="heading">Forgot your password?</text><text x="24" y="200" class="body">No worries. We’ll send you a link</text><text x="24" y="222" class="body">to get back to your people.</text><text x="24" y="252" class="label">Email address</text><rect x="24" y="262" width="342" height="44" rx="10" class="field"/><text x="38" y="289" class="placeholder">you@example.com</text><rect x="24" y="330" width="342" height="48" rx="10" class="fill-dark"/><text x="195" y="359" text-anchor="middle" class="button-text">Send reset link</text><rect x="24" y="410" width="342" height="110" rx="12" class="ph"/><text x="195" y="445" text-anchor="middle" class="small">After sending:</text><text x="195" y="461" text-anchor="middle" class="small">title becomes “Check your inbox.”,</text><text x="195" y="477" text-anchor="middle" class="small">a confirmation box appears,</text><text x="195" y="493" text-anchor="middle" class="small">button becomes “Send another link”.</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-04-forgot-password-notes"><text x="0" y="888" class="note">• The reset link opens the web page /reset, not the app.</text><text x="0" y="918" class="note">• Same confirmation whether or not an account exists for</text><text x="14" y="940" class="note">that email.</text></g>
  </g>
</svg>
