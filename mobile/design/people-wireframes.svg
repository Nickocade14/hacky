<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1416" viewBox="0 0 1000 1416" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / people wireframes</title>
  <desc id="description">Mobile people search with partial matches, and a person profile. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1416" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / people wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-06-search" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">06 / Search people</text><text x="390" y="-18" text-anchor="end" class="route">People tab</text>
    <g id="mobile-06-search-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="195" y="82" text-anchor="middle" class="title">People</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><rect x="24" y="118" width="342" height="44" rx="22" class="field"/><circle cx="46" cy="140" r="8" class="fill"/><text x="64" y="145" class="value">rea</text><text x="350" y="145" text-anchor="end" class="title">×</text><text x="24" y="186" class="small">5 people in Knight Hacks IX</text><circle cx="48" cy="232" r="20" class="fill"/><text x="80" y="228" class="label">Andrea Lopez</text><text x="80" y="247" class="small">@andrea_l · React, Node</text><rect x="304" y="219" width="62" height="26" rx="13" class="fill"/><text x="335" y="236" text-anchor="middle" class="chip">Hacker</text><text x="366" y="260" text-anchor="end" class="nav">→ 07</text><line x1="24" y1="268" x2="366" y2="268" class="line"/><circle cx="48" cy="304" r="20" class="fill"/><text x="80" y="300" class="label">Reagan Smith</text><text x="80" y="319" class="small">@reagan · Python, ML</text><rect x="304" y="291" width="62" height="26" rx="13" class="fill"/><text x="335" y="308" text-anchor="middle" class="chip">Hacker</text><line x1="24" y1="340" x2="366" y2="340" class="line"/><circle cx="48" cy="376" r="20" class="fill"/><text x="80" y="372" class="label">Bo Kim</text><text x="80" y="391" class="small">@bokim · React Native</text><rect x="304" y="363" width="62" height="26" rx="13" class="fill"/><text x="335" y="380" text-anchor="middle" class="chip">Mentor</text><line x1="24" y1="412" x2="366" y2="412" class="line"/><circle cx="48" cy="448" r="20" class="fill"/><text x="80" y="444" class="label">Theresa Wu</text><text x="80" y="463" class="small">@treasure · UX research</text><rect x="304" y="435" width="62" height="26" rx="13" class="fill"/><text x="335" y="452" text-anchor="middle" class="chip">Hacker</text><line x1="24" y1="484" x2="366" y2="484" class="line"/><circle cx="48" cy="520" r="20" class="fill"/><text x="80" y="516" class="label">Carlos Real</text><text x="80" y="535" class="small">@creal · Firebase</text><rect x="298" y="507" width="68" height="26" rx="13" class="fill"/><text x="332" y="524" text-anchor="middle" class="chip">Sponsor</text><line x1="24" y1="556" x2="366" y2="556" class="line"/><rect x="24" y="580" width="342" height="92" rx="12" class="ph"/><text x="195" y="614" text-anchor="middle" class="small">Empty state:</text><text x="195" y="630" text-anchor="middle" class="small">“No one matches ‘xyz’ yet.</text><text x="195" y="646" text-anchor="middle" class="small">Try a skill like React.”</text><line x1="0" y1="760" x2="390" y2="760" class="line"/><rect x="27" y="772" width="24" height="24" rx="7" class="fill"/><text x="39" y="814" text-anchor="middle" class="tab">Home</text><rect x="105" y="772" width="24" height="24" rx="7" class="fill-dark"/><text x="117" y="814" text-anchor="middle" class="tab-on">People</text><rect x="183" y="772" width="24" height="24" rx="7" class="fill"/><text x="195" y="814" text-anchor="middle" class="tab">Hacky</text><rect x="261" y="772" width="24" height="24" rx="7" class="fill"/><text x="273" y="814" text-anchor="middle" class="tab">Chats</text><rect x="339" y="772" width="24" height="24" rx="7" class="fill"/><text x="351" y="814" text-anchor="middle" class="tab">Me</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-06-search-notes"><text x="0" y="888" class="note">• Searches the server as the user types: GET</text><text x="14" y="910" class="note">/api/search?q= (partial, case-insensitive match on</text><text x="14" y="932" class="note">name, handle and skills).</text><text x="0" y="962" class="note">• Most relevant first. Blocked people and the user</text><text x="14" y="984" class="note">themself are left out.</text><text x="0" y="1014" class="note">• The matching part of each name or skill is bold.</text><text x="0" y="1044" class="note">• Tap a person → 07.</text></g>
  </g>

  <g id="mobile-07-person" transform="translate(510 230)">
    <text x="0" y="-18" class="frame-title">07 / Person profile</text><text x="390" y="-18" text-anchor="end" class="route">from 05, 06, 09, 12</text>
    <g id="mobile-07-person-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="86" class="heading">‹</text><text x="195" y="82" text-anchor="middle" class="title">Profile</text><text x="366" y="82" text-anchor="end" class="link">•••</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><circle cx="195" cy="166" r="48" class="fill"/><text x="195" y="244" text-anchor="middle" class="heading">Andrea Lopez</text><text x="195" y="268" text-anchor="middle" class="body">@andrea_l · Hacker</text><rect x="97" y="282" width="81" height="26" rx="13" class="fill"/><text x="137.5" y="299" text-anchor="middle" class="chip">Available</text><rect x="186" y="282" width="141" height="26" rx="13" class="fill"/><text x="256.5" y="299" text-anchor="middle" class="chip">Looking for a team</text><rect x="24" y="326" width="342" height="48" rx="10" class="fill-dark"/><text x="195" y="355" text-anchor="middle" class="button-text">Connect</text><text x="24" y="396" class="small">Button by relation: Connect · Request sent ·</text><text x="24" y="414" class="small">Accept / Not now · Message → 11</text><text x="24" y="448" class="tag">ABOUT</text><text x="24" y="472" class="body">Second hackathon. I like making</text><text x="24" y="492" class="body">clean UIs and fast APIs.</text><text x="24" y="528" class="tag">SKILLS</text><rect x="24" y="540" width="55" height="26" rx="13" class="fill"/><text x="51.5" y="557" text-anchor="middle" class="chip">React</text><rect x="87" y="540" width="48" height="26" rx="13" class="fill"/><text x="111" y="557" text-anchor="middle" class="chip">Node</text><rect x="143" y="540" width="55" height="26" rx="13" class="fill"/><text x="170.5" y="557" text-anchor="middle" class="chip">Figma</text><text x="24" y="596" class="tag">WANTS TO LEARN</text><rect x="24" y="608" width="68" height="26" rx="13" class="fill"/><text x="58" y="625" text-anchor="middle" class="chip">Flutter</text><rect x="100" y="608" width="35" height="26" rx="13" class="fill"/><text x="117.5" y="625" text-anchor="middle" class="chip">ML</text><text x="24" y="664" class="tag">TRACK · IDEA</text><text x="24" y="688" class="body">AI · Study buddy app that matches</text><text x="24" y="708" class="body">classmates by schedule.</text><text x="24" y="744" class="tag">LINKS</text><text x="24" y="768" class="link">GitHub · LinkedIn · Website</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-07-person-notes"><text x="0" y="888" class="note">• Data: GET /api/events/{slug}/people/{handle}. Its</text><text x="14" y="910" class="note">relation.state decides the button.</text><text x="0" y="940" class="note">• Connect opens a sheet with a required intro message</text><text x="14" y="962" class="note">(max 500), then POST /api/events/{slug}/requests.</text><text x="0" y="992" class="note">• Accept → POST /api/requests/{id}/accept, then Message</text><text x="14" y="1014" class="note">→ 11.</text><text x="0" y="1044" class="note">• ••• → Block (with a confirm step): POST /api/blocks.</text></g>
  </g>
</svg>
