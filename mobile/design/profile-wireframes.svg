<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1460" viewBox="0 0 1000 1460" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / my profile wireframes</title>
  <desc id="description">Mobile screen to edit my public profile and my event intake. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1460" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / my profile wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-08-my-profile" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">08 / My profile (edit)</text><text x="390" y="-18" text-anchor="end" class="route">Me tab</text>
    <g id="mobile-08-my-profile-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="195" y="82" text-anchor="middle" class="title">My profile</text><text x="366" y="82" text-anchor="end" class="link">Save</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><circle cx="195" cy="160" r="40" class="fill"/><text x="195" y="222" text-anchor="middle" class="link">Change Hacky style</text><text x="24" y="248" class="label">Name</text><rect x="24" y="258" width="342" height="38" rx="10" class="field"/><text x="38" y="282" class="value">Ethan Zeng</text><text x="24" y="318" class="label">Bio</text><rect x="24" y="328" width="342" height="64" rx="10" class="field"/><text x="38" y="354" class="placeholder">Tell people what you’re into</text><text x="24" y="420" class="tag">LINKS</text><rect x="24" y="430" width="342" height="34" rx="10" class="field"/><text x="38" y="452" class="placeholder">github.com/…</text><rect x="24" y="472" width="342" height="34" rx="10" class="field"/><text x="38" y="494" class="placeholder">linkedin.com/in/…</text><rect x="24" y="514" width="342" height="34" rx="10" class="field"/><text x="38" y="536" class="placeholder">https://your-site.dev</text><text x="24" y="578" class="tag">KNIGHT HACKS IX</text><text x="24" y="600" class="label">Skills</text><rect x="24" y="610" width="55" height="26" rx="13" class="fill"/><text x="51.5" y="627" text-anchor="middle" class="chip">React</text><rect x="87" y="610" width="48" height="26" rx="13" class="fill"/><text x="111" y="627" text-anchor="middle" class="chip">Node</text><rect x="143" y="610" width="55" height="26" rx="13" class="fill"/><text x="170.5" y="627" text-anchor="middle" class="chip">+ Add</text><text x="24" y="664" class="label">Skills you want to learn</text><rect x="24" y="674" width="68" height="26" rx="13" class="fill"/><text x="58" y="691" text-anchor="middle" class="chip">Flutter</text><rect x="100" y="674" width="55" height="26" rx="13" class="fill"/><text x="127.5" y="691" text-anchor="middle" class="chip">+ Add</text><text x="24" y="726" class="label">Experience</text><text x="366" y="726" text-anchor="end" class="small">scrolls ↓</text><line x1="0" y1="760" x2="390" y2="760" class="line"/><rect x="27" y="772" width="24" height="24" rx="7" class="fill"/><text x="39" y="814" text-anchor="middle" class="tab">Home</text><rect x="105" y="772" width="24" height="24" rx="7" class="fill"/><text x="117" y="814" text-anchor="middle" class="tab">People</text><rect x="183" y="772" width="24" height="24" rx="7" class="fill"/><text x="195" y="814" text-anchor="middle" class="tab">Hacky</text><rect x="261" y="772" width="24" height="24" rx="7" class="fill"/><text x="273" y="814" text-anchor="middle" class="tab">Chats</text><rect x="339" y="772" width="24" height="24" rx="7" class="fill-dark"/><text x="351" y="814" text-anchor="middle" class="tab-on">Me</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-08-my-profile-notes"><text x="0" y="888" class="note">• Top part is the public profile: PATCH /api/me/profile</text><text x="14" y="910" class="note">(name, bio, Hacky style, links).</text><text x="0" y="940" class="note">• Event part is the intake: PATCH /api/events/{slug}/me</text><text x="14" y="962" class="note">(skills, skills wanted, experience, goal, track,</text><text x="14" y="984" class="note">interests, idea).</text><text x="0" y="1014" class="note">• Further down: Experience, Goal, Track, Idea, Looking</text><text x="14" y="1036" class="note">for a team, and Sign out (→ 01).</text><text x="0" y="1066" class="note">• Save stays disabled until something changes. Field</text><text x="14" y="1088" class="note">errors show under each field.</text></g>
  </g>
</svg>
