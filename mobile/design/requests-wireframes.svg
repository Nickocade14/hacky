<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1438" viewBox="0 0 1000 1438" role="img" aria-labelledby="title description">
  <title id="title">Hacky mobile / requests wireframes</title>
  <desc id="description">Mobile list of incoming and outgoing connection requests. Low-fidelity, 390x844, for Figma import.</desc>
  <defs>
    <style>
      text{font-family:Lato,Arial,sans-serif;fill:#2b2b2b} .page-title{font-size:36px;font-weight:700} .intro{font-size:18px;fill:#6b6b6b} .frame-title{font-size:22px;font-weight:700} .route{font-size:15px;fill:#6b6b6b} .brand{font-size:26px;font-weight:700} .tag{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b6b6b} .heading{font-size:26px;font-weight:700} .title{font-size:17px;font-weight:700} .body{font-size:14px;fill:#6b6b6b} .label{font-size:13px;font-weight:700} .placeholder{font-size:14px;fill:#9a9a9a} .value{font-size:14px;fill:#2b2b2b} .button-text{font-size:15px;font-weight:700;fill:#fff} .button-text-dark{font-size:15px;font-weight:700} .link{font-size:13px;font-weight:700;text-decoration:underline} .small{font-size:12px;fill:#6b6b6b} .chip{font-size:12px;fill:#2b2b2b} .chip-on{font-size:12px;font-weight:700;fill:#fff} .bubble-on{font-size:14px;fill:#fff} .tab{font-size:11px;fill:#6b6b6b} .tab-on{font-size:11px;font-weight:700} .nav{font-size:12px;font-weight:700;fill:#2b2b2b} .note{font-size:14px;fill:#4a4a4a}
      .frame{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .field{fill:#fff;stroke:#bdbdbd;stroke-width:1.5} .fill{fill:#e3e3e3} .fill-dark{fill:#4a4a4a} .ph{fill:#efefef;stroke:#bdbdbd;stroke-width:1.5;stroke-dasharray:6 5} .line{stroke:#d6d6d6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="1438" fill="#f2f2f2"/>
  <text x="40" y="56" class="page-title">Hacky mobile / requests wireframes</text>
  <text x="40" y="90" class="intro">Low fidelity · 390×844 phone frames · grey boxes and labels only</text>
  <text x="40" y="120" class="intro">Screen numbers match across all files in mobile/design/.</text>
  <text x="40" y="150" class="intro">“→ 07” means “goes to screen 07”: link it in Figma Prototype mode.</text>
  <text x="960" y="55" text-anchor="end" class="tag">MOBILE · 390×844</text>

  <g id="mobile-09-requests" transform="translate(40 230)">
    <text x="0" y="-18" class="frame-title">09 / Requests</text><text x="390" y="-18" text-anchor="end" class="route">from 05 and 10</text>
    <g id="mobile-09-requests-screen">
      <rect x="0" y="0" width="390" height="844" rx="44" class="frame"/>
      <text x="28" y="30" class="label">9:41</text><rect x="318" y="19" width="44" height="13" rx="4" class="fill"/>
      <text x="24" y="86" class="heading">‹</text><text x="195" y="82" text-anchor="middle" class="title">Requests</text><line x1="0" y1="104" x2="390" y2="104" class="line"/><rect x="24" y="120" width="342" height="36" rx="10" class="fill"/><rect x="28" y="124" width="167" height="28" rx="8" class="frame"/><text x="111.5" y="143" text-anchor="middle" class="label">Incoming (2)</text><text x="278.5" y="143" text-anchor="middle" class="body">Outgoing (1)</text><rect x="24" y="172" width="342" height="168" rx="16" class="field"/><circle cx="52" cy="206" r="18" class="fill"/><text x="80" y="202" class="label">Maya Chen → 07</text><text x="80" y="222" class="small">@maya · Design</text><rect x="273" y="192" width="81" height="26" rx="13" class="fill"/><text x="313.5" y="209" text-anchor="middle" class="chip">via Hacky</text><text x="40" y="256" class="body">“Hi! Hacky said you know React. Want</text><text x="40" y="276" class="body">to build a study app together?”</text><rect x="40" y="290" width="150" height="38" rx="10" class="fill-dark"/><text x="115" y="314" text-anchor="middle" class="button-text">Accept</text><rect x="200" y="290" width="150" height="38" rx="10" class="field"/><text x="275" y="314" text-anchor="middle" class="button-text-dark">Not now</text><rect x="24" y="356" width="342" height="150" rx="16" class="field"/><text x="40" y="382" class="tag">TEAM INVITE</text><circle cx="52" cy="414" r="18" class="fill"/><text x="80" y="410" class="label">Team Byte Me</text><text x="80" y="430" class="small">from @andrea_l · 2 of 4</text><rect x="40" y="452" width="150" height="38" rx="10" class="fill-dark"/><text x="115" y="476" text-anchor="middle" class="button-text">Accept</text><rect x="200" y="452" width="150" height="38" rx="10" class="field"/><text x="275" y="476" text-anchor="middle" class="button-text-dark">Not now</text><text x="24" y="546" class="tag">ACCEPTED</text><circle cx="48" cy="588" r="20" class="fill"/><text x="80" y="584" class="label">Bo Kim</text><text x="80" y="603" class="small">@bokim · accepted today</text><line x1="24" y1="620" x2="366" y2="620" class="line"/><text x="366" y="594" text-anchor="end" class="link">Message → 11</text><rect x="128" y="826" width="134" height="5" rx="3" class="fill-dark"/>
    </g>
    <g id="mobile-09-requests-notes"><text x="0" y="888" class="note">• Data: GET /api/events/{slug}/requests (incoming and</text><text x="14" y="910" class="note">outgoing).</text><text x="0" y="940" class="note">• Accept → POST /api/requests/{id}/accept; the chat</text><text x="14" y="962" class="note">opens → 11.</text><text x="0" y="992" class="note">• Not now → POST /api/requests/{id}/hide. The sender</text><text x="14" y="1014" class="note">isn’t told.</text><text x="0" y="1044" class="note">• Outgoing tab: same cards with a “Pending” chip and no</text><text x="14" y="1066" class="note">buttons.</text></g>
  </g>
</svg>
