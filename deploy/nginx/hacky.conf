# Nginx site for Hacky. Template: deploy/setup-domain.sh replaces __DOMAIN__ with
# the real domain, writes the result to /etc/nginx/sites-available/hacky and runs
# certbot, which adds the HTTPS (443) server and the HTTP -> HTTPS redirect to the
# rendered file. Edit this template, not the rendered copy, then re-run the script.
#
#   /            built web app (React SPA), from /var/www/hacky-web/current
#   /api/        Express API (PM2 app hacky-api on 127.0.0.1:8787)
#   /socket.io/  same API, for Socket.IO live updates (WebSocket upgrade)

# WebSocket upgrade: "Connection: upgrade" only when the client asked for one.
# Prefixed with hacky_ so it can't clash with a map in another site file.
map $http_upgrade $hacky_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # deploy/deploy.sh builds each release into /var/www/hacky-web/releases/ and
    # then switches this symlink, so the site never serves a half-copied build.
    root /var/www/hacky-web/current;
    index index.html;

    server_tokens off;
    # The API itself limits JSON bodies to 100 kB.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html is always compressed once gzip is on, so it is not listed.
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hacky_connection_upgrade;
        # Pass responses through as they arrive, so streamed AI chat replies
        # aren't held back until they finish.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Socket.IO's default path. Harmless until the server adds Socket.IO.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hacky_connection_upgrade;
        proxy_buffering off;
        # Socket.IO pings every 25 s, so an open socket is never idle this long.
        proxy_read_timeout 120s;
    }

    # Files Vite fingerprints (name-<hash>.js etc. directly in /assets/) never
    # change at the same URL, so browsers may keep them for a year. Missing
    # files are a 404, not index.html, so a stale chunk fails loudly.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|svg|png|jpe?g|webp|avif|gif|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other files from web/public/assets (fonts, images) keep their names when
    # they change, so cache them for a week only.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html names the current hashed files, so browsers always revalidate
    # it and pick up a new deploy on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything else is a client-side route (/verify, /reset, ...) unless a
    # real file exists: serve index.html and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
