name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server (typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The tests start a temporary MongoDB; keep its binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Add jobs here when the folders exist:
  #   web:    cd web && npm ci && npm run build
  #   mobile: subosito/flutter-action, then flutter analyze && flutter test
