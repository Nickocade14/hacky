name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server (typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The tests start a temporary MongoDB; keep its binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  mobile:
    name: Mobile (analyze, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Flutter 3.47.7 ships Dart 3.13.5, which mobile/pubspec.yaml requires (^3.13.5).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Add jobs here when the folders exist:
  #   web:    cd web && npm ci && npm run build
